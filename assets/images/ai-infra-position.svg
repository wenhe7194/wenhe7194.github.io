<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc">
    <title id="title">AI Infra 核心层次图</title>
    <desc id="desc">AI Infra 位于业务应用和硬件资源之间，核心链路包括模型与数据资产、在线推理服务、编译算子运行时、硬件资源与系统平台。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#243244"/>
        </marker>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.14"/>
        </filter>
        <style>
            .title { fill: #172033; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 34px; font-weight: 700; }
            .subtitle { fill: #526173; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 17px; }
            .layer-title { fill: #fff; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; }
            .box-title { fill: #172033; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; }
            .box-text { fill: #334155; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 16px; }
            .small { fill: #526173; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 14px; }
            .tag { fill: #243244; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; }
            .line { stroke: #243244; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
            .boundary { fill: none; stroke: #334155; stroke-width: 2.2; stroke-dasharray: 10 8; }
            .entry { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
            .divider { stroke: #e2e8f0; stroke-width: 1.2; }
        </style>
    </defs>

    <rect width="960" height="1080" fill="#f8fafc"/>

    <text class="title" x="480" y="52" text-anchor="middle">AI Infra 在整体系统中的位置</text>
    <text class="subtitle" x="480" y="82" text-anchor="middle">核心关注：把业务请求和模型资产，稳定、高效地转化为硬件上的计算执行</text>

    <rect x="88" y="176" width="784" height="790" rx="14" class="boundary"/>
    <text class="tag" x="112" y="207">AI Infra 核心范围</text>

    <rect x="210" y="116" width="540" height="96" rx="10" fill="#3d8bd8" filter="url(#shadow)"/>
    <text class="layer-title" x="480" y="149" text-anchor="middle">应用与业务场景</text>
    <text class="box-text" x="480" y="178" text-anchor="middle" fill="#ffffff">Chat / RAG / Agent / 搜索推荐 / 内容生成 / 内部工具</text>

    <line class="line" x1="480" y1="212" x2="480" y2="256"/>
    <rect x="342" y="226" width="276" height="34" rx="17" class="entry"/>
    <text class="tag" x="480" y="248" text-anchor="middle">输入：用户请求 / API 调用</text>

    <rect x="170" y="272" width="620" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="170" y="272" width="620" height="38" rx="10" fill="#55a869"/>
    <text class="layer-title" x="480" y="298" text-anchor="middle">模型与数据资产层</text>
    <text class="box-title" x="480" y="338" text-anchor="middle">模型权重、Tokenizer、Embedding、Prompt、上下文数据</text>
    <line class="divider" x1="206" y1="356" x2="754" y2="356"/>
    <text class="small" x="480" y="378" text-anchor="middle">职责边界：管理“要运行什么模型、使用哪些参数和上下文”</text>

    <line class="line" x1="480" y1="388" x2="480" y2="438"/>
    <rect x="304" y="405" width="352" height="38" rx="19" class="entry"/>
    <text class="tag" x="480" y="430" text-anchor="middle">进入下一层：模型句柄 + 输入张量 / 上下文</text>

    <rect x="170" y="456" width="620" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="170" y="456" width="620" height="38" rx="10" fill="#7c6df2"/>
    <text class="layer-title" x="480" y="482" text-anchor="middle">在线推理服务层</text>
    <text class="box-title" x="480" y="524" text-anchor="middle">模型服务、路由、Batching、KV Cache、调度与限流</text>
    <text class="small" x="480" y="550" text-anchor="middle">典型组件：vLLM / SGLang / TensorRT-LLM / Triton Inference Server</text>
    <line class="divider" x1="206" y1="564" x2="754" y2="564"/>
    <text class="small" x="480" y="582" text-anchor="middle">职责边界：把外部请求组织成可执行的推理任务</text>

    <line class="line" x1="480" y1="590" x2="480" y2="640"/>
    <rect x="316" y="607" width="328" height="38" rx="19" class="entry"/>
    <text class="tag" x="480" y="632" text-anchor="middle">进入下一层：算子图 / Kernel 调用 / 执行计划</text>

    <rect x="170" y="658" width="620" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="170" y="658" width="620" height="38" rx="10" fill="#d65a4a"/>
    <text class="layer-title" x="480" y="684" text-anchor="middle">编译、算子库与运行时层</text>
    <text class="box-title" x="480" y="726" text-anchor="middle">图优化、IR、Pass、Kernel、Runtime、JIT / AOT</text>
    <text class="small" x="480" y="752" text-anchor="middle">典型方向：Triton、XLA、TVM、MLIR、算子库、内存计划、调度策略</text>
    <line class="divider" x1="206" y1="770" x2="754" y2="770"/>
    <text class="small" x="480" y="792" text-anchor="middle">职责边界：把模型计算转换成硬件可高效执行的程序</text>

    <line class="line" x1="480" y1="808" x2="480" y2="858"/>
    <rect x="306" y="825" width="348" height="38" rx="19" class="entry"/>
    <text class="tag" x="480" y="850" text-anchor="middle">进入下一层：设备代码 / Runtime 调用 / 调度指令</text>

    <rect x="170" y="876" width="620" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="170" y="876" width="620" height="38" rx="10" fill="#f0a51a"/>
    <text class="layer-title" x="480" y="902" text-anchor="middle">硬件资源与系统平台层</text>
    <text class="box-title" x="480" y="944" text-anchor="middle">GPU / NPU / TPU / ASIC、CPU、网络、存储、Kubernetes</text>
    <line class="divider" x1="206" y1="958" x2="754" y2="958"/>
    <text class="small" x="480" y="980" text-anchor="middle">职责边界：提供计算、内存、通信、隔离、调度和资源利用能力</text>

    <rect x="232" y="1016" width="496" height="38" rx="19" fill="#243244"/>
    <text class="layer-title" x="480" y="1042" text-anchor="middle">目标：低延迟、高吞吐、低成本、可移植、可维护</text>
</svg>
